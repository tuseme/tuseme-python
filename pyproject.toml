[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuseme-sdk"
version = "1.0.0"
description = "Official Python SDK for the Tuseme SMS API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Tuseme", email = "dev@tuseme.co.ke"},
]
keywords = ["sms", "tuseme", "api", "messaging", "kenya", "africa"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "black>=23.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://docs.tuseme.co.ke"
Documentation = "https://docs.tuseme.co.ke/sdks"
Repository = "https://github.com/tuseme/tuseme-python"
Issues = "https://github.com/tuseme/tuseme-python/issues"

[tool.setuptools.packages.find]
include = ["tuseme_sdk*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tuseme_sdk --cov-report=term-missing"
